<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kai — VSM F1 League</title>
  <link rel="icon" href="../Images/VSM.png" sizes="32x32" />
  <link rel="stylesheet" href="../Style/main.css">
  <link rel="stylesheet" href="../Style/stats.css">
</head>

<body>

  <!-- ============================================================
     NAV
     ============================================================ -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">VSM <em>F1</em> League</a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li class="active"><a href="../drivers.html">Drivers</a></li>
        <li class="nav-item nav-item--season">
          <a href="../season/1.html">Season</a>
          <div class="nav-dropdown">
            <div class="dropdown-label">All Seasons</div>
            <div class="dropdown-grid">
              <a href="../season/1.html" class="current">Season 1</a>
            </div>
          </div>
        </li>
        <li><a href="https://discord.gg/tXmGZc8z87" target="_blank" rel="noopener">Discord</a></li>
      </ul>
    </div>
  </nav>

  <!-- The .page wrapper adds top padding so the fixed nav above
       doesn't overlap the content — every page on the site uses it,
       don't remove it. -->
  <div class="page">

    <!-- ============================================================
       DRIVER HEADER
       — Edit everything below by hand: name, team, stats, socials.
       — Keep the photo inside the .driver-photo div — that's what
         sizes and crops it to a neat square. If you swap the <img>
         for a different file, just change the src, don't remove
         the wrapping div.
       — Team badge icon letter: edit the single character inside
         .team-icon (currently "F"). Swap tc-bg-ferrari
         for another team's slug (see Style/main.css) if a driver
         changes teams.
       ============================================================ -->
    <div class="driver-header-wrap">
      <div class="driver-header">
        <div class="driver-photo">
          <img src="../Images/KaiDriverPFP.jpeg" alt="Kai">
        </div>
        <div>
          <h1 class="driver-name">Kai</h1>
          <span class="driver-team-badge">
            <span class="team-icon tc-bg-ferrari">F</span>
            Ferrari
          </span>
          <div class="driver-social">
            <!-- Edit or delete these links -->
            <a href="https://www.twitch.tv/Kill3rKai" target="_blank" rel="noopener">Twitch</a>
            <a href="https://www.youtube.com/@Kill3rKai" target="_blank" rel="noopener">YouTube</a>
            <a href="https://www.kill3rkai.ai" target="_blank" rel="noopener">Website</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================
       CAREER STATS
       — Just edit the numbers in each .stat-value below.
       ============================================================ -->
    <h2 class="stats-heading">Career Stats</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">1</div>
        <div class="stat-label">Seasons</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Wins</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Podiums</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">2</div>
        <div class="stat-label">Points</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Titles</div>
      </div>
    </div>

    <footer class="footer">
      <span class="footer-logo">VSM <em>F1</em> League</span>
      <span class="footer-copy">Driver Profile</span>
    </footer>

  </div><!-- /page -->

  <script src="../Scripts/main.js"></script>
</body>

</html>
