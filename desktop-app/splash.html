<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.85);
    animation: logoIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .title {
    color: #f2f2f2;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards 0.3s;
  }

  .title em {
    color: #e10600;
    font-style: normal;
  }

  .bar-track {
    width: 160px;
    height: 3px;
    background: #232323;
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards 0.5s;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: #e10600;
    border-radius: 2px;
    animation: fill 1.3s ease-in-out forwards 0.5s;
  }

  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes fill {
    to { width: 100%; }
  }
</style>
</head>
<body>
  <div class="splash">
    <img class="logo" src="../Images/VSM.png" alt="VSM F1 League">
    <div class="title">VSM <em>F1</em> League</div>
    <div class="bar-track"><div class="bar-fill"></div></div>
  </div>
</body>
</html>
